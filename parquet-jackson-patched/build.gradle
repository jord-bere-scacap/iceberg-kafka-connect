plugins {
  alias(libs.plugins.shadow)
}

version = libs.versions.jackson.ver.get()

configurations {
  jacksonRuntime {
    canBeConsumed = false
  }
}

dependencies {
  jacksonRuntime(enforcedPlatform(libs.jackson.bom))
  jacksonRuntime libs.jackson.core
  jacksonRuntime libs.jackson.databind
  jacksonRuntime libs.jackson.annotations
}

tasks.named("jar") {
  enabled = false
  manifest.attributes.clear()
  manifest.attributes(
      "Implementation-Title": "Parquet relocated Jackson (locally patched)",
      "Implementation-Version": project.version,
      "Implementation-Vendor": "Scalable Capital",
  )
}

tasks.named("shadowJar") {
  archiveBaseName.set("parquet-jackson-patched")
  archiveClassifier.set("")
  configurations = [project.configurations.jacksonRuntime]
  relocate "com.fasterxml.jackson", "shaded.parquet.com.fasterxml.jackson"
  exclude "META-INF/*.SF", "META-INF/*.RSA", "META-INF/*.DSA"
  // Match Parquet's base-only loading and avoid processing Java 21 overrides with Shadow 8.
  exclude "module-info.class", "META-INF/versions/**"
  preserveFileTimestamps = false
  reproducibleFileOrder = true
  mergeServiceFiles()
  append "META-INF/LICENSE"
  append "META-INF/NOTICE"
}

// Consumers receive only the relocated JAR; unshaded build inputs stay private.
configurations.apiElements.outgoing.artifacts.clear()
configurations.runtimeElements.outgoing.artifacts.clear()
configurations.apiElements.outgoing.variants.clear()
configurations.runtimeElements.outgoing.variants.clear()
configurations.shadowRuntimeElements.canBeConsumed = false
artifacts {
  apiElements tasks.named("shadowJar")
  runtimeElements tasks.named("shadowJar")
}
