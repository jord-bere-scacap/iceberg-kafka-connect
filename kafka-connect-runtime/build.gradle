import org.gradle.api.attributes.java.TargetJvmVersion

plugins {
  id "distribution"
}

configurations {
  glueConverterArchive {
    canBeConsumed = false
    transitive = false
  }
  glueMskRuntime {
    canBeConsumed = false
    extendsFrom runtimeClasspath
    attributes {
      attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
      attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
      attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
      attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17)
    }
    exclude group: "javax.activation", module: "activation"
    // Iceberg's AWS integration uses the aligned SDK modules below.
    exclude group: "org.apache.iceberg", module: "iceberg-aws-bundle"
    exclude group: "org.apache.iceberg", module: "iceberg-azure"
    exclude group: "org.apache.iceberg", module: "iceberg-azure-bundle"
    exclude group: "org.apache.iceberg", module: "iceberg-gcp"
    exclude group: "org.apache.iceberg", module: "iceberg-gcp-bundle"
    exclude group: "org.apache.iceberg", module: "iceberg-nessie"
    // These APIs and authentication implementations are supplied by the MSK worker.
    exclude group: "org.apache.kafka"
    exclude group: "org.slf4j"
    exclude group: "software.amazon.msk", module: "aws-msk-iam-auth"
  }
  hive {
    extendsFrom runtimeClasspath
  }
  all {
    resolutionStrategy.force "org.codehaus.jettison:jettison:1.5.4"
    resolutionStrategy.force "org.apache.commons:commons-compress:1.26.0"
  }
}

dependencies {
  glueConverterArchive libs.glue.converter
  glueMskRuntime libs.glue.common
  glueMskRuntime libs.glue.serde
  glueMskRuntime(enforcedPlatform(libs.aws.sdk.bom))
  constraints {
    glueMskRuntime(libs.scala.library) {
      because "Fix CVE-2022-36944 in Glue's Scala 2.13 dependency"
    }
  }
  ["s3", "glue", "sts", "kms", "dynamodb", "apache-client", "url-connection-client"].each {
    glueMskRuntime "software.amazon.awssdk:${it}"
  }
  implementation(enforcedPlatform(libs.netty.bom))
  implementation project(":iceberg-kafka-connect")
  implementation project(":iceberg-kafka-connect-transforms")
  implementation(libs.hadoop.common) {
    exclude group: "log4j"
    exclude group: "org.slf4j"
    exclude group: "ch.qos.reload4j"
    exclude group: "org.apache.avro", module: "avro"
    exclude group: "com.google.guava"
    exclude group: "com.google.protobuf"
    exclude group: "org.apache.curator"
    exclude group: "org.apache.zookeeper"
    exclude group: "org.apache.kerby"
    exclude group: "org.apache.hadoop", module: "hadoop-auth"
    exclude group: "org.apache.commons", module: "commons-configuration2"
    exclude group: "org.apache.hadoop.thirdparty", module: "hadoop-shaded-protobuf_3_25"
    exclude group: "org.eclipse.jetty"
  }
  runtimeOnly libs.bundles.iceberg.ext
  // Digester and Validator still reference BeanUtils after Hadoop stops bringing it transitively.
  runtimeOnly libs.commons.beanutils

  hive libs.iceberg.hive.metastore
  hive(libs.hive.metastore) {
    exclude group: "org.apache.avro", module: "avro"
    exclude group: "org.slf4j", module: "slf4j-log4j12"
    exclude group: "org.pentaho" // missing dependency
    exclude group: "org.apache.hbase"
    exclude group: "org.apache.logging.log4j"
    exclude group: "co.cask.tephra"
    exclude group: "com.google.code.findbugs", module: "jsr305"
    exclude group: "org.eclipse.jetty.aggregate", module: "jetty-all"
    exclude group: "org.eclipse.jetty.orbit", module: "javax.servlet"
    exclude group: "org.apache.parquet", module: "parquet-hadoop-bundle"
    exclude group: "com.tdunning", module: "json"
    exclude group: "javax.transaction", module: "transaction-api"
    exclude group: "com.zaxxer", module: "HikariCP"
    exclude group: "org.apache.hadoop", module: "hadoop-yarn-server-common"
    exclude group: "org.apache.hadoop", module: "hadoop-yarn-server-applicationhistoryservice"
    exclude group: "org.apache.hadoop", module: "hadoop-yarn-server-resourcemanager"
    exclude group: "org.apache.hadoop", module: "hadoop-yarn-server-web-proxy"
    exclude group: "org.apache.hive", module: "hive-service-rpc"
    exclude group: "com.github.joshelser", module: "dropwizard-metrics-hadoop-metrics2-reporter"
  }
  hive(libs.hadoop.client) {
    exclude group: "org.apache.avro", module: "avro"
    exclude group: "org.slf4j", module: "slf4j-log4j12"
  }

  testImplementation libs.bundles.iceberg
  testImplementation libs.iceberg.aws.bundle
  testImplementation libs.bundles.jackson
  testImplementation libs.bundles.kafka.connect

  testImplementation libs.junit.api
  testImplementation libs.junit.params
  testRuntimeOnly libs.junit.engine

  testImplementation libs.mockito
  testImplementation libs.assertj
  testImplementation libs.awaitility
  testImplementation libs.testcontainers
  testImplementation libs.testcontainers.kafka
  testImplementation libs.http.client
}

def glueConverterThinJar = tasks.register("glueConverterThinJar", Jar) {
  description = "Extracts only the Glue converter from its published fat JAR."
  archiveBaseName.set("schema-registry-kafkaconnect-converter-thin")
  archiveVersion.set(libs.versions.glue.ver)
  preserveFileTimestamps = false
  reproducibleFileOrder = true
  from({ zipTree(configurations.glueConverterArchive.singleFile) }) {
    include "com/amazonaws/services/schemaregistry/kafkaconnect/**"
    // This converter-owned helper accesses Avro's package-private schema internals.
    include "org/apache/avro/Schemas.class"
    include "META-INF/maven/software.amazon.glue/schema-registry-kafkaconnect-converter/**"
    include "META-INF/LICENSE*", "META-INF/NOTICE*"
    include "LICENSE", "NOTICE"
  }
  manifest.attributes(
      "Implementation-Title": "AWS Glue Schema Registry Kafka Connect converter (thin)",
      "Implementation-Version": libs.versions.glue.ver.get(),
      "Implementation-Vendor": "Amazon Web Services",
  )
}

dependencies {
  glueMskRuntime files(glueConverterThinJar)
}

sourceSets {
  glueMskCompatibilityTest
}

checkstyle {
  sourceSets = [project.sourceSets.main, project.sourceSets.test]
}

dependencies {
  // File dependencies preserve the exact packaged graph and its exclusions.
  glueMskCompatibilityTestImplementation files(configurations.glueMskRuntime)
  ["kafka-clients", "connect-api", "connect-json", "connect-transforms"].each {
    glueMskCompatibilityTestImplementation("org.apache.kafka:${it}:${libs.versions.msk.kafka.ver.get()}") {
      transitive = false
    }
  }
  glueMskCompatibilityTestImplementation libs.slf4j
  glueMskCompatibilityTestImplementation libs.junit.api
  glueMskCompatibilityTestImplementation libs.junit.params
  glueMskCompatibilityTestImplementation libs.mockito
  glueMskCompatibilityTestRuntimeOnly libs.junit.engine
}

tasks.named("compileGlueMskCompatibilityTestJava", JavaCompile) {
  javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(17) }
  options.release = 17
}

tasks.register("glueMskCompatibilityTest", Test) {
  description = "Runs offline Glue/MSK compatibility checks on Java 17 and Kafka 3.7.0."
  group = "verification"
  testClassesDirs = sourceSets.glueMskCompatibilityTest.output.classesDirs
  classpath = sourceSets.glueMskCompatibilityTest.runtimeClasspath
  javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
  useJUnitPlatform()
  systemProperty "aws.disableEc2Metadata", "true"
}

processResources {
  filter {
    it.replace("__VERSION__", project.version.toString())
  }
}

distributions {
  glueMsk {
    contents {
      from(processResources.destinationDir) { include "manifest.json" }
      into("lib/") { from configurations.glueMskRuntime }
      into("doc/") {
        from "$rootDir/LICENSE"
        from "$rootDir/README.md"
      }
      into("assets/") { from "$rootDir/logos" }
    }
  }
  main {
    contents {
      from(processResources.destinationDir) {
        include "manifest.json"
      }
      into("lib/") {
        from configurations.runtimeClasspath
      }
      into("doc/") {
        from "$rootDir/LICENSE"
        from "$rootDir/README.md"
      }
      into("assets/") {
        from "$rootDir/logos"
      }
    }
  }
  hive {
    contents {
      from(processResources.destinationDir) {
        include "manifest.json"
      }
      into("lib/") {
        from configurations.hive
      }
      into("doc/") {
        from "$rootDir/LICENSE"
        from "$rootDir/README.md"
      }
      into("assets/") {
        from "$rootDir/logos"
      }
    }
  }
}

publishing {
  publications {
    main(MavenPublication) {
      artifact distZip
    }
    hive(MavenPublication) {
      artifact hiveDistZip
    }
  }
}

tasks.jar.enabled = false

tasks.distTar.enabled = false
distZip.dependsOn processResources
installDist.dependsOn processResources

tasks.hiveDistTar.enabled = false
hiveDistZip.dependsOn processResources
installHiveDist.dependsOn processResources

tasks.glueMskDistTar.enabled = false
glueMskDistZip.dependsOn processResources
installGlueMskDist.dependsOn processResources

// The distribution plugin adds archives to assemble; keep Glue packaging explicitly opt-in.
configurations.archives.artifacts.removeAll { artifact ->
  artifact.buildDependencies.getDependencies(null).any {
    it.name in ["glueMskDistZip", "glueMskDistTar"]
  }
}

// build the install before test so it can be installed into kafka connect
test.dependsOn installDist

assemble.dependsOn distZip, hiveDistZip
