buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath(libs.spotless.gradle)
    classpath(libs.palantir.gradle)
  }
}

plugins {
  alias(libs.plugins.nebula.release)
}

subprojects {
  apply plugin: "java"
  apply plugin: "com.diffplug.spotless"
  apply plugin: "com.palantir.baseline-checkstyle"
  apply plugin: "maven-publish"

  group "io.tabular.connect"

  repositories {
    mavenCentral()
    maven {
      url = "https://tabular-repository-public.s3.amazonaws.com/releases"
    }
  }

  sourceCompatibility = "1.8"
  targetCompatibility = "1.8"

  dependencies {
    implementation(enforcedPlatform(libs.jackson.bom))
  }

  plugins.withId("java-test-fixtures") {
    dependencies {
      testFixturesImplementation(enforcedPlatform(libs.jackson.bom))
    }
  }

  def standaloneVersions = [
      "commons-beanutils:commons-beanutils": libs.versions.commons.beanutils.ver.get(),
      "org.apache.httpcomponents.client5:httpclient5": libs.versions.http.client.ver.get(),
      "org.apache.httpcomponents.core5:httpcore5": libs.versions.http.core.ver.get(),
      "org.apache.httpcomponents.core5:httpcore5-h2": libs.versions.http.core.ver.get(),
      "org.apache.commons:commons-lang3": libs.versions.commons.lang.ver.get(),
      "com.google.guava:guava": libs.versions.guava.ver.get(),
      "dnsjava:dnsjava": libs.versions.dnsjava.ver.get(),
      "org.apache.hadoop.thirdparty:hadoop-shaded-guava": libs.versions.hadoop.shaded.guava.ver.get(),
      "org.bouncycastle:bcprov-jdk18on": libs.versions.bouncycastle.ver.get(),
      "io.airlift:aircompressor": libs.versions.aircompressor.ver.get(),
      "at.yawk.lz4:lz4-java": libs.versions.lz4.ver.get(),
      "org.xerial.snappy:snappy-java": libs.versions.snappy.ver.get(),
  ]

  configurations.all {
    resolutionStrategy.eachDependency { details ->
      def standaloneVersion = standaloneVersions["${details.requested.group}:${details.requested.name}".toString()]
      if (standaloneVersion != null) {
        details.useVersion standaloneVersion
        details.because "Use patched libraries for security findings D05–D08 and D10–D14, including Hadoop transitives"
      }
      if (details.requested.group == "org.apache.hadoop") {
        details.useVersion libs.versions.hadoop.ver.get()
        details.because "Align Hadoop modules for security finding D14"
      }
      if (details.requested.group == "org.apache.parquet") {
        details.useVersion libs.versions.parquet.ver.get()
        details.because "Align Parquet modules to fix CVE-2025-30065 and CVE-2025-46762"
      }
    }
    if (name != "originalIcebergGuava") {
      resolutionStrategy.dependencySubstitution {
        substitute module("org.apache.iceberg:iceberg-bundled-guava") using project(":iceberg-guava-patched") because "Replace Iceberg's relocated Guava for security finding D05"
        substitute module("org.lz4:lz4-java") using module("at.yawk.lz4:lz4-java:${libs.versions.lz4.ver.get()}") because "Use one patched LZ4 implementation for security finding D07"
      }
    }
  }

  test {
    useJUnitPlatform()
  }

  jar {
    manifest {
      attributes(
          "Implementation-Title": project.name,
          "Implementation-Version": project.version,
          "Implementation-Vendor": "Tabular Technologies, Inc.",
          "Build-Timestamp": java.time.Instant.now().toString(),
          "Build-JDK": "${System.properties["java.version"]} (${System.properties["java.vendor"]} ${System.properties["java.vm.version"]})",
          "Build-OS": "${System.properties["os.name"]} ${System.properties["os.arch"]} ${System.properties["os.version"]}",
      )
    }
  }

  spotless {
    java {
      target project.fileTree(project.rootDir) {
        include 'src/**/*.java'
        exclude 'src/*/io/debezium/**/*.java'
      }
      googleJavaFormat("1.7")
      removeUnusedImports()
      licenseHeaderFile "$rootDir/header.txt"
    }
  }

  checkstyle {
    toolVersion '9.3'
  }

  publishing {
    repositories {
      maven {
        authentication {
          awsIm(AwsImAuthentication)
        }
        url = "s3://tabular-repository-public/releases"
      }
    }
  }
}
